<text x="40" y="380" font-size="11" fill="#FF0000">※ 本移行ではロードバランサ（LB）を利用しない。QA 環境・開発環境も同一経路（ホスト名のみ異なる）。</text>
<text x="40" y="398" font-size="11" fill="#FF0000">※ Tomcat のポート番号は現行 WebLogic の採番（60100 番台／60200 番台）を踏襲した案。Tomcat/Apache 設計書で確定する。</text>
