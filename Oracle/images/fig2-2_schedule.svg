<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" font-family="'Noto Sans CJK JP','Noto Sans JP','MS PGothic',sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="520" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="18" font-weight="bold">図 2-2　移行スケジュール概要（本番環境）</text>

  <!-- time axis -->
  <line x1="60" y1="90" x2="1360" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <!-- phase blocks on axis -->
  <g>
    <rect x="60" y="100" width="260" height="60" fill="#D9D9D9" stroke="#333"/>
    <text x="190" y="125" text-anchor="middle" font-weight="bold">0. 事前準備・リハーサル</text>
    <text x="190" y="147" text-anchor="middle" font-size="12">W-4 ～ W-1（dev→qa で確立）</text>

    <rect x="320" y="100" width="200" height="60" fill="#BDD7EE" stroke="#333"/>
    <text x="420" y="125" text-anchor="middle" font-weight="bold">1. 初期全量移行</text>
    <text x="420" y="147" text-anchor="middle" font-size="12">W0 土～日（1～2 日、実測で確定）</text>

    <rect x="520" y="100" width="420" height="60" fill="#E2EFDA" stroke="#333"/>
    <text x="730" y="125" text-anchor="middle" font-weight="bold">2. 検証期間（約 1 週間）</text>
    <text x="730" y="147" text-anchor="middle" font-size="12">新環境：アプリ接続・業務・性能検証　／　現行：本番稼働継続</text>

    <rect x="940" y="100" width="200" height="60" fill="#F8CBAD" stroke="#333"/>
    <text x="1040" y="125" text-anchor="middle" font-weight="bold">3. 差分移行・本番切替</text>
    <text x="1040" y="147" text-anchor="middle" font-size="12">W1 日曜（業務停止 4 時間以内）</text>

    <rect x="1140" y="100" width="220" height="60" fill="#D9D9D9" stroke="#333"/>
    <text x="1250" y="125" text-anchor="middle" font-weight="bold">4. 後片付け・現行保持</text>
    <text x="1250" y="147" text-anchor="middle" font-size="12">切替後 1 か月（切戻し期間）</text>
  </g>

  <!-- markers -->
  <g font-size="12">
    <line x1="330" y1="70" x2="330" y2="100" stroke="#C00000" stroke-width="2"/>
    <text x="322" y="62" text-anchor="end" fill="#C00000" font-weight="bold">S0：全量エクスポートの基準 SCN（FLASHBACK_SCN）</text>

    <line x1="520" y1="70" x2="520" y2="100" stroke="#2F5597" stroke-width="2"/>
    <text x="528" y="62" text-anchor="start" fill="#2F5597" font-weight="bold">スナップショット取得（基点）</text>

    <line x1="930" y1="70" x2="930" y2="100" stroke="#2F5597" stroke-width="2"/>
    <text x="900" y="62" text-anchor="middle" fill="#2F5597" font-weight="bold">切替前日：基点へ復元</text>

    <line x1="960" y1="170" x2="960" y2="200" stroke="#C00000" stroke-width="2"/>
    <text x="960" y="215" text-anchor="middle" fill="#C00000" font-weight="bold">S1：業務停止後の SCN</text>
  </g>

  <!-- detail lanes -->
  <g font-size="13">
    <rect x="60" y="240" width="1300" height="1" fill="#999"/>
    <text x="60" y="262" font-weight="bold">現行システム（Oracle 11g）</text>
    <rect x="60" y="272" width="880" height="26" fill="#FFFFFF" stroke="#333"/>
    <text x="500" y="290" text-anchor="middle">本番稼働（更新あり）　※検証期間中は DDL 変更・アプリリリースを凍結</text>
    <rect x="940" y="272" width="60" height="26" fill="#F8CBAD" stroke="#333"/>
    <text x="970" y="290" text-anchor="middle" font-size="11">停止</text>
    <rect x="1000" y="272" width="360" height="26" fill="#D9D9D9" stroke="#333"/>
    <text x="1180" y="290" text-anchor="middle">停止状態で保持（切戻し用）→ 1 か月後に廃止</text>

    <text x="60" y="332" font-weight="bold">新環境（RDS for Oracle 19c）</text>
    <rect x="60" y="342" width="260" height="26" fill="#FFFFFF" stroke="#333"/>
    <text x="190" y="360" text-anchor="middle">構築・事前作成（表領域・ユーザ）</text>
    <rect x="320" y="342" width="200" height="26" fill="#BDD7EE" stroke="#333"/>
    <text x="420" y="360" text-anchor="middle">取込（分割）・事後処理</text>
    <rect x="520" y="342" width="410" height="26" fill="#E2EFDA" stroke="#333"/>
    <text x="725" y="360" text-anchor="middle">検証（検証データの更新は許容）</text>
    <rect x="930" y="342" width="70" height="26" fill="#F8CBAD" stroke="#333"/>
    <text x="965" y="360" text-anchor="middle" font-size="11">復元→差分</text>
    <rect x="1000" y="342" width="360" height="26" fill="#FFFFFF" stroke="#333"/>
    <text x="1180" y="360" text-anchor="middle">本番稼働（監視・バックアップ運用開始）</text>
  </g>

  <!-- cutover detail -->
  <g font-size="13">
    <text x="60" y="410" font-weight="bold">3. 差分移行・本番切替の内訳（目安、リハーサル実測で確定）</text>
    <rect x="60" y="420" width="150" height="30" fill="#F8CBAD" stroke="#333"/>
    <text x="135" y="440" text-anchor="middle" font-size="12">業務停止・S1 取得</text>
    <rect x="210" y="420" width="220" height="30" fill="#F8CBAD" stroke="#333"/>
    <text x="320" y="440" text-anchor="middle" font-size="12">差分エクスポート（方式A／B）</text>
    <rect x="430" y="420" width="180" height="30" fill="#F8CBAD" stroke="#333"/>
    <text x="520" y="440" text-anchor="middle" font-size="12">転送（rsync→S3→RDS）</text>
    <rect x="610" y="420" width="260" height="30" fill="#F8CBAD" stroke="#333"/>
    <text x="740" y="440" text-anchor="middle" font-size="12">取込（TRUNCATE＋投入／MERGE）・事後処理</text>
    <rect x="870" y="420" width="200" height="30" fill="#F8CBAD" stroke="#333"/>
    <text x="970" y="440" text-anchor="middle" font-size="12">検証（件数・ハッシュ・疎通）</text>
    <rect x="1070" y="420" width="290" height="30" fill="#F8CBAD" stroke="#333"/>
    <text x="1215" y="440" text-anchor="middle" font-size="12">接続切替・業務確認・サービス開始</text>
    <line x1="60" y1="465" x2="1360" y2="465" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="60" y="485" font-size="12">0:00</text>
    <text x="700" y="485" font-size="12" text-anchor="middle">切戻し判断ポイント（T+3:00：取込・検証が完了していなければ現行へ切戻し）</text>
    <text x="1355" y="485" font-size="12" text-anchor="end">4:00 以内</text>
  </g>
</svg>
