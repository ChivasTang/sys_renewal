<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="600" viewBox="0 0 1420 600" font-family="'Noto Sans CJK JP','Noto Sans JP','MS PGothic',sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#C00000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1420" height="600" fill="#FFFFFF"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#000">図 2-1　Oracle 移行構成・データ転送経路（1 環境あたり）</text>

  <!-- AWS account frame -->
  <rect x="20" y="50" width="1380" height="440" fill="none" stroke="#666" stroke-dasharray="6,4" rx="8"/>
  <text x="32" y="72" font-size="13" fill="#666">AWS アカウント（同一）・東京リージョン</text>

  <!-- Current VPC -->
  <rect x="40" y="90" width="300" height="380" fill="#F2F2F2" stroke="#999" rx="8"/>
  <text x="52" y="112" font-size="14" font-weight="bold" fill="#333">現行 VPC</text>

  <!-- Current DB server -->
  <rect x="55" y="130" width="270" height="150" fill="#FFFFFF" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="65" y="152" font-weight="bold">現行 DB サーバ（EC2）</text>
  <text x="65" y="172">RHEL 5.4／Oracle Database 11g R2 EE</text>
  <text x="65" y="192" font-size="13">・expdp（FLASHBACK_SCN・PARALLEL）</text>
  <text x="65" y="212">・ディレクトリオブジェクト DPUMP_MIG</text>
  <text x="65" y="232" font-size="13">・件数記録（expdp ログ）・チェックサム</text>
  <text x="65" y="262" fill="#C00000">※検証期間中も本番稼働を継続</text>

  <!-- Temp EBS -->
  <rect x="55" y="300" width="270" height="70" fill="#FFF2CC" stroke="#BF9000" stroke-width="1.5" rx="6"/>
  <text x="65" y="322" font-weight="bold">一時 EBS（gp3 2TB、暗号化）</text>
  <text x="65" y="342">/dpump（ext3）：ダンプ出力先</text>
  <text x="65" y="360" font-size="12" fill="#555">移行完了後にデタッチ・削除</text>
  <line x1="190" y1="280" x2="190" y2="300" stroke="#333" stroke-width="1.5"/>

  <text x="55" y="410" font-size="12" fill="#555">SG：新 AP/API サーバからの TCP 22</text>
  <text x="55" y="428" font-size="12" fill="#555">（rsync over ssh）のみ許可</text>
  <text x="55" y="446" font-size="12" fill="#555">ssh 暗号方式：LEGACY 互換設定（一時）</text>

  <!-- VPC Peering arrow -->
  <line x1="340" y1="205" x2="450" y2="205" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="395" y="190" text-anchor="middle" font-size="12" font-weight="bold">VPC Peering</text>
  <text x="395" y="224" text-anchor="middle" font-size="12">① rsync（pull）</text>

  <!-- New VPC -->
  <rect x="450" y="90" width="930" height="380" fill="#E2EFDA" stroke="#548235" rx="8"/>
  <text x="462" y="112" font-size="14" font-weight="bold" fill="#333">移行後 VPC</text>

  <!-- New AP/API server -->
  <rect x="470" y="130" width="260" height="190" fill="#FFFFFF" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="480" y="152" font-weight="bold">新 AP/API サーバ（EC2）</text>
  <text x="480" y="172" font-size="13">RHEL 9（icaph01w 等、AP/API サーバ）</text>
  <text x="480" y="192">・AWS CLI v2（aws s3 cp、SSE-KMS）</text>
  <text x="480" y="212">・Oracle Instant Client 19c</text>
  <text x="480" y="232">　（sqlplus／impdp／SQL*Loader）</text>
  <text x="480" y="252">・中継領域 /disk3/dpump（2TB）</text>
  <text x="480" y="272">・移行スクリプト・ログ保管</text>
  <text x="480" y="300" font-size="12" fill="#555">IAM ロール：S3 移行用バケット書込み</text>

  <!-- S3 -->
  <rect x="820" y="130" width="210" height="110" fill="#FFFFFF" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="830" y="152" font-weight="bold">S3 移行用バケット</text>
  <text x="830" y="172">・SSE-KMS 暗号化</text>
  <text x="830" y="192">・パブリックアクセスブロック</text>
  <text x="830" y="212">・ライフサイクル（期限削除）</text>
  <text x="830" y="232" font-size="12" fill="#555">Gateway VPC エンドポイント経由</text>

  <!-- RDS -->
  <rect x="1130" y="130" width="240" height="190" fill="#FFFFFF" stroke="#333" stroke-width="1.5" rx="6"/>
  <text x="1140" y="152" font-weight="bold">Amazon RDS for Oracle 19c EE</text>
  <text x="1140" y="172">icdbh01／icdbq01／icdbd01（BYOL）</text>
  <text x="1140" y="192">・オプション：S3_INTEGRATION、</text>
  <text x="1140" y="212">　Timezone=Asia/Tokyo</text>
  <text x="1140" y="232">・DATA_PUMP_DIR（分割取込）</text>
  <text x="1140" y="252">・AL32UTF8、gp3 約 2,000GB</text>
  <text x="1140" y="272" font-size="13">・スナップショット（初期取込完了時）</text>
  <text x="1140" y="300" font-size="12" fill="#555">IAM ロール：S3 読み書き</text>

  <!-- arrows: server -> S3 -->
  <line x1="730" y1="185" x2="820" y2="185" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="775" y="172" text-anchor="middle" font-size="12">② aws s3 cp</text>
  <!-- S3 -> RDS -->
  <line x1="1030" y1="185" x2="1130" y2="185" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1080" y="172" text-anchor="middle" font-size="12">③ download</text>
  <text x="1080" y="206" text-anchor="middle" font-size="11">_from_s3</text>
  <!-- server -> RDS impdp -->
  <path d="M730,290 L1130,290" stroke="#C00000" stroke-width="2" fill="none" marker-end="url(#arrRed)"/>
  <text x="930" y="282" text-anchor="middle" font-size="12" fill="#C00000">④ impdp／sqlplus（TCP 1521）：取込・事後処理・検証</text>

  <!-- App verification -->
  <rect x="470" y="340" width="560" height="112" fill="#FFFFFF" stroke="#333" stroke-width="1" stroke-dasharray="4,3" rx="6"/>
  <text x="480" y="362" font-weight="bold">検証期間（約 1 週間）の接続確認対象 → RDS エンドポイント（1521）</text>
  <text x="480" y="382" font-size="13">・Tomcat JNDI DataSource（context.xml、ojdbc8）　・ASTERIA Warp 接続定義</text>
  <text x="480" y="401" font-size="13">・シェル／バッチ（sqlplus・SQL*Loader）・JP1 ジョブ</text>
  <text x="480" y="420" font-size="13">・Salesforce Data Loader（Windows Server 2025）</text>
  <text x="480" y="441" font-size="12" fill="#555">※検証で更新したデータは、差分移行前にスナップショットからの復元で破棄する</text>
  <path d="M1030,395 L1250,395 L1250,320" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="1262" y="380" font-size="12" fill="#333">JDBC／OCI</text>
  <text x="1262" y="398" font-size="12" fill="#333">接続検証</text>

  <!-- legend -->
  <text x="20" y="515" font-size="12" fill="#333">経路：① 現行→新サーバ：rsync over ssh（VPC Peering）　② 新サーバ→S3：AWS CLI v2　③ S3→RDS：rdsadmin.rdsadmin_s3_tasks.download_from_s3　④ 新サーバ→RDS：impdp（Instant Client）</text>
  <text x="20" y="537" font-size="12" fill="#333">凡例：黒実線＝ダンプファイルの流れ、赤線＝DB 接続（取込・検証）、黄色＝移行のために一時的に追加する資源。全区間で暗号化（EBS／ssh／SSE-KMS／RDS ストレージ暗号化）。</text>
  <text x="20" y="559" font-size="12" fill="#333">差分移行（本番切替）も同一経路で実施する（差分ダンプは小容量のため短時間）。</text>
</svg>
